name: Image audit

# Temporary workflow: downloads the stock images used on the site (plus
# replacement candidates) so they can be visually verified. Will be removed
# once the audit is complete.

on:
  push:
    branches: [claude/clever-mayer-4tcd2]
    paths: ['.github/workflows/image-audit.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p audit-images
          dl() { curl -fsSL --max-time 30 "$1" -o "audit-images/$2" || echo "FAILED: $2"; }
          U="https://images.unsplash.com/photo"
          K="https://www.kitchencraft.com/file/media/kitchencraft/products/environment"
          # Currently used on the site
          dl "$K/gentry/gentry2.jpg" kc-gentry2.jpg
          dl "$K/summit/acrylicbluekitchen1.jpg" kc-summit1.jpg
          dl "$K/lexington/off_white_cabinets_in_casual_kitchen_2.jpg" kc-lex2.jpg
          dl "$K/lexington/off_white_cabinets_in_casual_kitchen_5.jpg" kc-lex5.jpg
          dl "$U-1556909114-f6e7ad7d3136?w=480&q=60" u-09114-f6e7.jpg
          dl "$U-1556909114-44e3e70034e2?w=480&q=60" u-09114-44e3.jpg
          dl "$U-1556909172-54557c7e4fb7?w=480&q=60" u-09172.jpg
          dl "$U-1556909190-eccf4a8bf97a?w=480&q=60" u-09190.jpg
          dl "$U-1556909212-d5b604d0c90d?w=480&q=60" u-09212.jpg
          dl "$U-1556911220-bff31c812dba?w=480&q=60" u-11220.jpg
          dl "$U-1604709177225-055f99402ea3?w=480&q=60" u-1604709.jpg
          dl "$U-1484154218962-a197022b5858?w=480&q=60" u-1484154.jpg
          # Unsplash replacement candidates
          dl "$U-1556910103-1c02745aae4d?w=480&q=60" cand-10103.jpg
          dl "$U-1556912173-3bb406ef7e77?w=480&q=60" cand-12173.jpg
          dl "$U-1556912167-f556f1f39fdf?w=480&q=60" cand-12167.jpg
          dl "$U-1571508601891-ca5e7a713859?w=480&q=60" cand-15715.jpg
          dl "$U-1586208958839-06c17cacdf08?w=480&q=60" cand-15862.jpg
          dl "$U-1588854337115-1c67d9247e4d?w=480&q=60" cand-15888.jpg
          dl "$U-1570222094114-d054a817e56b?w=480&q=60" cand-15702.jpg
          dl "$U-1565538810643-b5bdb714032a?w=480&q=60" cand-15655.jpg
          dl "$U-1556185781-a47769abb7ee?w=480&q=60" cand-15561.jpg
          dl "$U-1574739782594-db4ead022697?w=480&q=60" cand-15747.jpg
          dl "$U-1507089947368-19c1da9775ae?w=480&q=60" cand-15070.jpg
          dl "$U-1593696140826-c58b021acf8b?w=480&q=60" cand-15936.jpg
          # Kitchen Craft URL-pattern candidates (may 404)
          dl "$K/lexington/off_white_cabinets_in_casual_kitchen_1.jpg" kc-lex1.jpg
          dl "$K/lexington/off_white_cabinets_in_casual_kitchen_3.jpg" kc-lex3.jpg
          dl "$K/lexington/off_white_cabinets_in_casual_kitchen_4.jpg" kc-lex4.jpg
          dl "$K/gentry/gentry1.jpg" kc-gentry1.jpg
          dl "$K/gentry/gentry3.jpg" kc-gentry3.jpg
          dl "$K/summit/acrylicbluekitchen2.jpg" kc-summit2.jpg
          ls -la audit-images
      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add audit-images
          git commit -m "Add audit images [skip ci]" || exit 0
          git push
